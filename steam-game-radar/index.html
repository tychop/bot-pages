<style>
:root{--bg:#07090f;--panel:#0f1420;--panel2:#141b2b;--line:#222c42;--text:#e8ecf5;--muted:#8d97ad;--dim:#5d6780;

[hidden]{display:none!important}
*{box-sizing:border-box}html{scroll-behavior:smooth}

.wrap{max-width:1880px;margin:0 auto;padding:0 clamp(16px,3vw,48px)}

.changes,.picks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.pick{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text)}

.pick .lead{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent2);font-weight:700}
.change{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;padding:10px 14px}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(7,9,15,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:12px;padding-bottom:12px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}

label.sel{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk span{width:38px;height:22px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.2s}
.chk span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.chk input:checked+span{background:rgba(56,225,255,.25);border-color:var(--accent)}
.chk input:checked+span::after{left:18px;background:var(--accent)}
.showing{margin-left:auto;color:var(--dim);font-size:14px}
#results-view>.sel{margin-bottom:20px}
.grid{display:grid;gap:clamp(16px,1.6vw,28px);grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);border-color:#34405c;box-shadow:0 18px 40px -18px rgba(56,225,255,.35)}
.art{position:relative;display:block;aspect-ratio:616/353;background:#0b0f18;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .art img{transform:scale(1.03)}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}

.badge.new{background:var(--accent2);color:#fff;border-color:transparent}
.badge.sale{background:var(--good);color:#04130a;border-color:transparent;margin-left:auto}
.badge.ea{color:var(--warn)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.title{font-size:21px;font-weight:800;line-height:1.2;margin:0}
.title a{color:var(--text)}.title a:hover{color:var(--accent)}
.trow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.web{flex:none;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;font-weight:700;margin-top:2px}
.web:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}.web svg{width:14px;height:14px}
.genre{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.why{margin:0;color:#c5cce0;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(7,9,15,.5);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-weight:700}
.stat .v{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.was{color:var(--dim);text-decoration:line-through;font-weight:500;font-size:13px;margin-left:6px}
.bar{height:5px;border-radius:9px;background:var(--panel2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good))}
.rmeta{font-size:12px;color:var(--muted);font-weight:500}
.deck-Verified{color:var(--good)}.deck-Playable{color:var(--ok)}.deck-Unsupported{color:var(--bad)}.deck-Unknown{color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px;margin-top:auto}
.shots button{all:unset;cursor:zoom-in;border-radius:8px;overflow:hidden;aspect-ratio:600/338;background:#0b0f18;border:1px solid var(--line)}
.shots button:focus-visible{outline:2px solid var(--accent)}
.shots img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}.shots button:hover img{opacity:.8}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);background:var(--panel2)}
td.n,th.n{text-align:right}tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;border-radius:12px}
.empty{color:var(--muted);padding:24px 0}
footer{color:var(--dim);font-size:13px;padding:40px 0 60px;border-top:1px solid var(--line);margin-top:40px}
#lb{position:fixed;inset:0;z-index:100;background:rgba(3,4,8,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#lb.open{display:flex}
#lb img{max-width:94vw;max-height:84vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6);background:#000}
#lb .cap{color:var(--muted);font-size:14px}
#lb button{all:unset;cursor:pointer;position:absolute;color:#fff;font-size:34px;line-height:1;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.06)}
#lb button:hover{background:rgba(255,255,255,.14)}
#lb .x{top:16px;right:16px}#lb .prev{left:16px;top:50%;transform:translateY(-50%)}#lb .next{right:16px;top:50%;transform:translateY(-50%)}

@media (max-width:640px){.showing{margin-left:0;width:100%}header.hero{min-height:260px}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button,a,input,select{touch-action:manipulation}button,select,input{min-height:44px}header.hero{min-height:225px}header.hero .wrap{padding-top:36px;padding-bottom:24px}h1{font-size:clamp(30px,4vw,54px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px!important}.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.chip[aria-current=page]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
#f-search{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;min-width:180px}.reset,.shots-open{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}.shots-open{margin-top:auto;text-align:left}.section-note{color:var(--muted);font-size:14px;margin-top:-8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.genre-tile{position:relative;aspect-ratio:616/353;display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}.genre-tile img{width:100%;height:100%;object-fit:cover;transition:transform .25s}.genre-tile:hover img{transform:scale(1.04)}.genre-tile>div{position:absolute;inset:auto 0 0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(7,9,15,.98))}.genre-tile strong{display:block;color:var(--text);font-size:20px}.genre-tile span{display:block;color:#c5cce0;font-size:12px;white-space:normal}.highlight-strip{display:grid;grid-auto-flow:column;grid-auto-columns:300px;gap:14px;overflow-x:auto;padding:5px 5px 16px;scroll-snap-type:x proximity}.highlight-strip>.card{scroll-snap-align:start}.highlight-strip .title{font-size:17px}.highlight-strip .body{padding:12px}.highlight-strip .rmeta{font-size:11px}.badge.rank{color:var(--text);font-size:15px}.card{content-visibility:auto;contain-intrinsic-size:auto 550px}.highlight-strip .card{content-visibility:visible}.search-label{flex:1}.search-label input{width:100%}
@media(min-width:1800px){html{font-size:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(410px,1fr))}.chip{font-size:14px;padding:7px 12px}}@media(max-width:640px){.chips{max-height:95px;overflow-y:auto}.toolbar .wrap{gap:8px}.highlight-strip{grid-auto-columns:270px}}

.pagination{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}.pagination button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer;font:inherit}.pagination button[aria-current=page]{background:var(--accent);color:var(--bg)}.pagination button:disabled{opacity:.35;cursor:default}

header.hero{min-height:200px}.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:12px}
.gtools{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:16px}.genre-tile span+span{opacity:.8}
.stat.metric{grid-column:1/-1}.pagination .gap{color:var(--dim);padding:8px 4px}.pagination .jump input{width:90px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
#dlg{position:fixed;inset:0;z-index:90;background:rgba(3,4,8,.86);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 16px}#dlg.open{display:flex}
.dlg-box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:980px;width:100%;padding:24px}.dlg-box h3{margin:0 40px 8px 0;font-size:24px}
.dlg-x{position:absolute;top:12px;right:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:24px;width:44px;cursor:pointer}
table.mt th{white-space:normal;text-transform:none;letter-spacing:0;font-size:14px;color:var(--muted);width:32%}table.mt td{white-space:normal}table.mt td.src{color:var(--dim);font-size:12px}
footer h3{color:var(--text)}footer table td{white-space:normal;font-size:13px}optgroup{font-weight:700;color:var(--muted)}option{color:var(--text)}

<body>
<header class="hero">
  <div class="wrap">
    <div class="kicker">Steam Machine · Weekly radar · Edition 5</div>
    <h1>Steam Machine Game Radar</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="updated"><span class="dot"></span>Last updated <b id="updated"></b><span id="ed"></span></div>
  </div>
</header>
<div class="toolbar"><div class="wrap" id="controls">
  <label class="sel">Genre <select id="f-genre" aria-label="Genre"></select></label>
  <label class="sel search-label">Search <input id="f-search" type="search" placeholder="Search every game…" autocomplete="off" aria-label="Search every game"></label>
  <label class="sel">Sort <select id="f-sort" aria-label="Sort by"></select></label>
  <button id="f-more" class="reset" aria-expanded="false" aria-controls="filters">Filters</button>
  <button id="reset" class="reset">Reset</button>
  <div class="showing" id="showing" aria-live="polite"></div>
</div>
<div class="wrap filters" id="filters" hidden>
  <label class="sel">Players <select id="f-mode" aria-label="Player modes"><option value="">Any</option><option value="1">Single-player only</option><option value="2">Local co-op</option><option value="4">Online co-op</option><option value="8">PvP</option></select></label>
  <label class="sel">Controller <select id="f-ctl" aria-label="Controller support"><option value="">Any</option><option value="2">Full support</option><option value="1">Partial or full</option></select></label>
  <label class="sel" title="Indie = has Steam's Indie tag. Publisher = publisher has 10+ games in this radar. Small = everything else.">Developer <select id="f-dev" aria-label="Developer size"><option value="">Any</option><option value="0">Indie (Indie tag)</option><option value="1">Small publisher</option><option value="2">Publisher (10+ radar titles)</option></select></label>
  <label class="chk"><input type="checkbox" id="f-sale"><span></span>On sale</label>
  <label class="chk"><input type="checkbox" id="f-deck"><span></span>Deck Verified</label>
  <label class="chk"><input type="checkbox" id="f-free"><span></span>Free</label>
  <label class="chk" title="At least 90% positive Steam reviews and at most 100,000 estimated owners (SteamSpy upper bound)"><input type="checkbox" id="f-gem"><span></span>Hidden gems</label>
</div>
<nav class="wrap chips" id="genre-chips" aria-label="Popular genres"></nav></div>
<main class="wrap">
  <div id="home-view">
    <section class="block"><h2>Highlights</h2><p class="section-note">Best-ranked new releases (last 60 days), deals of 50% or more, and hidden gems.</p><div class="highlight-strip" id="highlights"></div></section>
    <section class="block"><h2>All genres <span class="count" id="genre-count"></span></h2>
      <div class="gtools"><label class="sel search-label">Find a genre <input id="g-search" type="search" placeholder="e.g. Metroidvania" autocomplete="off" aria-label="Find a genre"></label>
      <label class="sel">Sort genres <select id="g-sort" aria-label="Sort genres"><option value="count">Most games</option><option value="reviews">Most reviews (popularity)</option><option value="name">A–Z</option></select></label>
      <label class="sel">Type <select id="g-cat" aria-label="Genre type"><option value="">All types</option><option>Top Genre</option><option>Genre</option><option>Sub Genre</option><option>Curated</option></select></label></div>
      <div class="tiles" id="genre-tiles"></div></section>
  </div>
  <section class="block" id="results-view" hidden><h2 id="view-title" tabindex="-1"></h2><p id="view-detail" class="section-note"></p><label class="sel">Games per page <select id="f-page-size" aria-label="Games per page"><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></label><div class="grid" id="groups"></div><nav id="pagination" class="pagination" aria-label="Game pages"></nav></section>
  <footer id="about"></footer>
</main>
<div id="dlg" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="dlg-title"><div class="dlg-box"><button class="dlg-x" aria-label="Close details">×</button><div id="dlg-body"></div></div></div>
<div id="lb" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Screenshot viewer">
  <button class="x" aria-label="Close">×</button><button class="prev" aria-label="Previous">‹</button><button class="next" aria-label="Next">›</button>
  <img alt=""><div class="cap"></div>
</div>
